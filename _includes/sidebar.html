{% include base_path %}

{% if page.url == "/" or page.url == "/about/" %}
  {% if page.author_profile or layout.author_profile %}
    <div class="sidebar sticky">
      {% include author-profile.html %}
    </div>
  {% endif %}
{% else %}
  <style>
    @media (min-width: 64em) {
      #auto-toc-sidebar {
        padding-right: 1.8rem !important;
      }
      #auto-toc-sidebar .toc {
        max-width: 205px !important;
      }
    }
    #auto-toc-sidebar .toc {
      background: #fafafa !important;
      border: 1px solid #e5e7eb !important;
      border-radius: 6px !important;
      padding: 0.75rem 0.95rem !important;
    }
    #auto-toc-sidebar .nav__title,
    #auto-toc-sidebar .toc,
    #auto-toc-sidebar li,
    #auto-toc-sidebar a {
      text-transform: none !important;
      letter-spacing: normal !important;
    }
    #auto-toc-sidebar .nav__title {
      font-size: 1.0rem !important;
      font-weight: 700 !important;
      margin: 0 0 0.55rem 0 !important;
      color: #222 !important;
      border-bottom: 1px solid #ddd !important;
      padding-bottom: 0.3rem !important;
    }
    #auto-toc-list a {
      font-size: 0.75rem !important;
      line-height: 1.42 !important;
      color: #444 !important;
      text-decoration: none !important;
      display: block !important;
    }
    #auto-toc-list a:hover {
      color: #000 !important;
      text-decoration: underline !important;
    }
  </style>

  <div class="sidebar sticky" id="auto-toc-sidebar">
    <nav class="toc">
      <header>
        <h4 class="nav__title">Contents</h4>
      </header>
      <ul id="auto-toc-list" style="list-style: none; margin: 0; padding: 0;"></ul>
    </nav>
  </div>

  <script>
    (function() {
      function buildToc() {
        var tocList = document.getElementById('auto-toc-list');
        var sidebar = document.getElementById('auto-toc-sidebar');
        if (!tocList || !sidebar) return;

        var headings = Array.from(document.querySelectorAll('.page__content h1, .page__content h2, .page__content h3, .archive h1, .archive h2, .archive h3')).filter(function(h) {
          if (h.closest('.sidebar') || h.closest('.masthead') || h.closest('.page__footer')) return false;
          if (h.classList.contains('page__title') || h.classList.contains('archive__item-title')) return false;
          return h.textContent.trim().length > 0;
        });

        if (headings.length === 0) {
          sidebar.style.display = 'none';
          return;
        }

        tocList.innerHTML = '';
        var hasTop = headings.some(function(x) { return x.tagName === 'H1' || x.tagName === 'H2'; });

        headings.forEach(function(h, idx) {
          if (!h.id) {
            h.id = 'sec-' + idx + '-' + h.textContent.trim().toLowerCase().replace(/[^a-z0-9]+/g, '-');
          }
          var li = document.createElement('li');
          var isSub = (h.tagName === 'H3' && hasTop);
          li.style.cssText = 'margin-bottom: 0.45rem; padding-left: ' + (isSub ? '0.8rem' : '0') + ';';

          var a = document.createElement('a');
          a.href = '#' + h.id;
          a.textContent = h.textContent.replace(/\(Full list.*\)/i, '').trim();

          li.appendChild(a);
          tocList.appendChild(li);
        });
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', buildToc);
      } else {
        buildToc();
      }
    })();
  </script>
{% endif %}

{% include base_path %}

{% if page.url == "/" or page.url == "/about/" %}
  {% if page.author_profile or layout.author_profile %}
    <div class="sidebar sticky">
      {% include author-profile.html %}
    </div>
  {% endif %}
{% else %}
  <style>
    html {
      scroll-behavior: smooth;
    }
    @media (min-width: 64em) {
      #auto-toc-sidebar {
        padding-right: 1.8rem !important;
      }
      #auto-toc-sidebar .toc {
        max-width: 215px !important;
      }
    }
    #auto-toc-sidebar .toc {
      background: #fafafa !important;
      border: 1px solid #e5e7eb !important;
      border-radius: 6px !important;
      padding: 0.9rem 1.05rem !important;
    }
    #auto-toc-sidebar .nav__title,
    #auto-toc-sidebar .toc,
    #auto-toc-sidebar li,
    #auto-toc-sidebar a {
      text-transform: none !important;
      letter-spacing: normal !important;
    }
    /* Level 1: "Contents" Header */
    #auto-toc-sidebar .toc .nav__title {
      font-size: 1.05rem !important;
      font-weight: 700 !important;
      margin: 0 0 0.85rem 0 !important;
      color: #222 !important;
      border-bottom: 1px solid #ddd !important;
      padding-bottom: 0.35rem !important;
    }
    #auto-toc-sidebar .toc #auto-toc-list li.toc-main {
      margin-bottom: 0.9rem !important;
      margin-top: 0 !important;
    }
    #auto-toc-sidebar .toc #auto-toc-list li.toc-sub {
      padding-left: 0.85rem !important;
      margin-bottom: 0.5rem !important;
      margin-top: 0 !important;
    }
    #auto-toc-sidebar .toc #auto-toc-list li:last-child {
      margin-bottom: 0 !important;
    }
    #auto-toc-sidebar .toc #auto-toc-list a {
      line-height: 1.3 !important;
      text-decoration: none !important;
      display: block !important;
      padding-left: 0.55rem !important;
      border-left: 2px solid transparent !important;
      transition: all 0.2s ease !important;
    }
    /* Level 2: Main Categories (Journal Articles, Invited Talks, Oral Presentations, etc.) */
    #auto-toc-sidebar .toc #auto-toc-list li.toc-main > a {
      font-size: 0.80rem !important;
      font-weight: 500 !important;
      color: #444 !important;
    }
    /* Level 3: Nested Years (2026, 2025, etc.) */
    #auto-toc-sidebar .toc #auto-toc-list li.toc-sub > a {
      font-size: 0.65rem !important;
      font-weight: 400 !important;
      color: #666 !important;
    }
    #auto-toc-sidebar .toc #auto-toc-list a:hover {
      color: #111 !important;
    }
    #auto-toc-sidebar .toc #auto-toc-list a.toc-active {
      color: #000 !important;
      font-weight: 700 !important;
      border-left: 2px solid #000 !important;
    }
  </style>

  <div class="sidebar sticky" id="auto-toc-sidebar">
    <nav class="toc">
      <header>
        <h4 class="nav__title">Contents</h4>
      </header>
      <ul id="auto-toc-list" style="list-style: none; margin: 0; padding: 0;"></ul>
    </nav>
  </div>

  <script>
    (function() {
      function buildToc() {
        var tocList = document.getElementById('auto-toc-list');
        var sidebar = document.getElementById('auto-toc-sidebar');
        if (!tocList || !sidebar) return;

        var headings = Array.from(document.querySelectorAll('.page__content h1, .page__content h2, .page__content h3, .archive h1, .archive h2, .archive h3')).filter(function(h) {
          if (h.closest('.sidebar') || h.closest('.masthead') || h.closest('.page__footer')) return false;
          if (h.classList.contains('page__title') || h.classList.contains('archive__item-title')) return false;
          return h.textContent.trim().length > 0;
        });

        if (headings.length === 0) {
          sidebar.style.display = 'none';
          return;
        }

        tocList.innerHTML = '';
        var hasTop = headings.some(function(x) { return x.tagName === 'H1' || x.tagName === 'H2'; });
        var links = [];

        headings.forEach(function(h, idx) {
          if (!h.id) {
            h.id = 'sec-' + idx + '-' + h.textContent.trim().toLowerCase().replace(/[^a-z0-9]+/g, '-');
          }
          var li = document.createElement('li');
          var isSub = (h.tagName === 'H3' && hasTop);
          li.className = isSub ? 'toc-sub' : 'toc-main';

          var a = document.createElement('a');
          a.href = '#' + h.id;
          a.textContent = h.textContent.replace(/\(Full list.*\)/i, '').trim();

          li.appendChild(a);
          tocList.appendChild(li);
          links.push({ heading: h, link: a });
        });

        function onScroll() {
          var scrollPos = window.scrollY || document.documentElement.scrollTop;
          var current = links;

          for (var i = 0; i < links.length; i++) {
            var top = links[i].heading.getBoundingClientRect().top + scrollPos - 110;
            if (scrollPos >= top) {
              current = links[i];
            }
          }

          if ((window.innerHeight + scrollPos) >= document.body.offsetHeight - 10) {
            current = links[links.length - 1];
          }

          links.forEach(function(item) {
            item.link.classList.remove('toc-active');
          });
          if (current) {
            current.link.classList.add('toc-active');
          }
        }

        window.addEventListener('scroll', onScroll, { passive: true });
        onScroll();
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', buildToc);
      } else {
        buildToc();
      }
    })();
  </script>
{% endif %}
